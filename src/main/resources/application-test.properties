# Test Configuration using H2 in MySQL Mode
spring.datasource.url=jdbc:h2:mem:disaster_relief_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2.sql

# DDUS Algorithmic Test Weights
app.ddus.weight-urgency=35.0
app.ddus.weight-population=35.0
app.ddus.weight-terrain=30.0

# Worker Threads
app.dispatch.thread-pool-size=5

# Logging
logging.level.com.disasterrelief=INFO

