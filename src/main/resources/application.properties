# ==============================================================================
# DISASTER RELIEF SUPPLY & EMERGENCY MEDICAL LOGISTICS DISPATCH SYSTEM (DREMLDS)
# APPLICATION CONFIGURATION
# ==============================================================================

spring.application.name=disaster-relief-dispatch
server.port=${SERVER_PORT:8080}

# Database Connection (MySQL 8 / MariaDB Wire Compatible)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:disaster_relief_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=ReliefHikariPool

# DDUS Urgency Scoring Engine Configurable Weights
# Formula: (Urgency/10)*Wu + (Population/1000)*Wp + (100-TerrainRisk)*Wt
app.ddus.weight-urgency=${DDUS_WEIGHT_URGENCY:35.0}
app.ddus.weight-population=${DDUS_WEIGHT_POPULATION:35.0}
app.ddus.weight-terrain=${DDUS_WEIGHT_TERRAIN:30.0}

# Multithreaded Dispatch Executor Service Config
app.dispatch.thread-pool-size=${DISPATCH_THREAD_POOL_SIZE:8}

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# OpenAPI Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.com.disasterrelief=INFO
logging.level.org.springframework.web=INFO

